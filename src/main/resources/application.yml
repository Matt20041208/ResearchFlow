spring:
  application:
    name: research-flow
  datasource:
    url: jdbc:h2:file:./data/researchflow;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    chat:
      client:
        enabled: false
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: none
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
    mcp:
      client:
        enabled: ${RESEARCH_FLOW_MCP_ENABLED:false}
        type: SYNC
        request-timeout: 20s
        toolcallback:
          enabled: false
        sse:
          connections:
            research-tools:
              url: ${RESEARCH_FLOW_MCP_URL:http://localhost:9000}
server:
  port: 8080
research-flow:
  executor-threads: 8
  max-attempts: 3
  mcp:
    server:
      enabled: ${RESEARCH_FLOW_MCP_SERVER_ENABLED:false}
  react:
    max-iterations: 3
    max-elapsed-ms: 60000
  subscription:
    scan-interval-ms: 60000
  validation:
    executor-threads: 2
  search:
    crossref-url: https://api.crossref.org/works
    rows: 5
