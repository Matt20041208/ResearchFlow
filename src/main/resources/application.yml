spring:
  application:
    name: research-flow
  datasource:
    url: jdbc:h2:file:./data/researchflow;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: 8080
research-flow:
  executor-threads: 8
  max-attempts: 3
  search:
    crossref-url: https://api.crossref.org/works
    rows: 5
  llm:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-seconds: 45
