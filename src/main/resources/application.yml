spring:
  application:
    name: research-flow
server:
  port: 8080
research-flow:
  executor-threads: 8
  search:
    crossref-url: https://api.crossref.org/works
    rows: 5
  llm:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-seconds: 45
